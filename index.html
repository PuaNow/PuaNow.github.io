<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Far Future Solutions</title>
  <meta name="description" content="Far Future Solutions — aquaculture, photography, and applied systems work in Northern California." />
  <style>
    :root {
      --bg: #0f1410;
      --fg: #e8efe6;
      --muted: #9aab96;
      --card: #1a2218;
      --line: #2a3528;
      --accent: #8fbc8f;
      --accent2: #c4a574;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #1c2a1c 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, #1a1f2a 0%, transparent 45%),
        var(--bg);
      color: var(--fg);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    main {
      width: min(36rem, 100%);
    }
    .eyebrow {
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0 0 0.75rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 5vw, 2.35rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .links {
      display: grid;
      gap: 0.85rem;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    a.card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    a.card strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 0.2rem;
    }
    a.card span {
      color: var(--muted);
      font-size: 0.92rem;
    }
    a.card.secondary:hover { border-color: var(--accent2); }
    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Far Future Solutions LLC</p>
    <h1>Building toward what comes next.</h1>
    <p class="lede">Aquaculture, photography, and applied systems work from Ukiah, California. This domain is parked while projects grow.</p>
    <div class="links">
      <a class="card secondary" href="https://depthofabstraction.com/">
        <strong>Depth of Abstraction</strong>
        <span>Photography and visual work by Paul Taylor.</span>
      </a>
    </div>
    <footer>© Far Future Solutions LLC · Ukiah, CA</footer>
  </main>
</body>
</html>
