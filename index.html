<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Far Future Solutions</title>
  <meta name="description" content="Far Future Solutions LLC â€” applied systems work from Ukiah, California." />
  <style>
    :root {
      --bg: #0f1410;
      --fg: #e8efe6;
      --muted: #9aab96;
      --accent: #8fbc8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #1c2a1c 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, #1a1f2a 0%, transparent 45%),
        var(--bg);
      color: var(--fg);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    main { width: min(32rem, 100%); }
    .eyebrow {
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 1rem;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.9rem, 5.5vw, 2.6rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
    }
    .contact {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.7rem 1.35rem;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.01em;
      box-shadow: 0 0 0 1px rgba(143, 188, 143, 0.35), 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .contact:hover,
    .contact:focus-visible {
      filter: brightness(1.08);
      transform: translateY(-1px);
      outline: none;
    }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .hit-counter {
      margin-top: 1.75rem;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      padding: 0.65rem 0.85rem 0.75rem;
      background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 40%, #0a0a0a 100%);
      border: 2px solid #666;
      border-top-color: #999;
      border-left-color: #888;
      border-right-color: #333;
      border-bottom-color: #222;
      box-shadow: inset 0 0 0 1px #000, 3px 3px 0 #000;
      font-family: "Courier New", Courier, monospace;
    }
    .hit-counter .label {
      color: #cfcfcf;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .hit-counter .digits {
      display: inline-flex;
      gap: 2px;
      padding: 4px 6px;
      background: #020802;
      border: 2px inset #444;
      box-shadow: inset 0 0 8px #000;
    }
    .hit-counter .digit {
      width: 1.05em;
      font-size: 1.35rem;
      line-height: 1.2;
      color: #39ff14;
      text-shadow: 0 0 6px #39ff14, 0 0 12px #1aff00;
      background: #001100;
      border: 1px solid #0a3a0a;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .hit-counter .sub {
      color: #888;
      font-size: 0.65rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Far Future Solutions LLC</p>
    <h1>Building toward what comes next.</h1>
    <p>Applied systems work from Ukiah, California.</p>
    <p>
      <a class="contact" href="mailto:paul@farfuturesolutions.com">Contact</a>
    </p>
    <div class="hit-counter" aria-label="Visit counter">
      <span class="label">You are visitor #</span>
      <span class="digits" id="hit-digits" aria-live="polite"></span>
      <span class="sub">hits since 1997</span>
    </div>
    <footer>Â© Far Future Solutions LLC</footer>
  </main>
  <script>
    (function () {
      var el = document.getElementById("hit-digits");
      function render(n) {
        var s = String(Math.max(0, Math.floor(Number(n) || 0)));
        while (s.length < 8) s = "0" + s;
        el.textContent = "";
        for (var i = 0; i < s.length; i++) {
          var d = document.createElement("span");
          d.className = "digit";
          d.textContent = s.charAt(i);
          el.appendChild(d);
        }
      }
      render(0);
      // Free no-signup counter (abacus); increments on each page load
      fetch("https://abacus.jasoncameron.dev/hit/farfuturesolutions.com/park")
        .then(function (r) { return r.json(); })
        .then(function (data) { render(data && data.value); })
        .catch(function () { /* keep zeros if blocked */ });
    })();
  </script>
</body>
</html>
