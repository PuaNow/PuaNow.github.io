<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Far Future Solutions</title>
  <meta name="description" content="Far Future Solutions LLC — applied systems and consulting from Ukiah, California." />
  <style>
    :root {
      --bg: #0f1410;
      --fg: #e8efe6;
      --muted: #9aab96;
      --accent: #8fbc8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #1c2a1c 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, #1a1f2a 0%, transparent 45%),
        var(--bg);
      color: var(--fg);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    main {
      width: min(36rem, 100%);
    }
    .eyebrow {
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0 0 0.75rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 5vw, 2.35rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }
    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Far Future Solutions LLC</p>
    <h1>Building toward what comes next.</h1>
    <p class="lede">Applied systems and consulting from Ukiah, California.</p>
    <footer>© Far Future Solutions LLC · Ukiah, CA</footer>
  </main>
</body>
</html>
