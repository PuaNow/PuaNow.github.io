<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Far Future Solutions</title>
  <meta name="description" content="Far Future Solutions LLC &mdash; applied systems work from Ukiah, California." />
  <style>
    :root {
      --bg: #0f1410;
      --fg: #e8efe6;
      --muted: #9aab96;
      --accent: #8fbc8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #1c2a1c 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, #1a1f2a 0%, transparent 45%),
        var(--bg);
      color: var(--fg);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem max(5.25rem, calc(env(safe-area-inset-bottom) + 4.75rem));
      text-align: center;
    }
    main { width: min(32rem, 100%); }
    .eyebrow {
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 1rem;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.9rem, 5.5vw, 2.6rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
    }
    .contact {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.7rem 1.35rem;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.01em;
      box-shadow: 0 0 0 1px rgba(143, 188, 143, 0.35), 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .contact:hover,
    .contact:focus-visible {
      filter: brightness(1.08);
      transform: translateY(-1px);
      outline: none;
    }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .eggman-link {
      position: fixed;
      z-index: 20;
      right: max(0.75rem, env(safe-area-inset-right));
      bottom: max(0.75rem, env(safe-area-inset-bottom));
      width: 48px;
      height: 56px;
      display: grid;
      place-items: center;
      padding: 4px;
      box-sizing: border-box;
      border-radius: 999px;
      background: rgba(15, 20, 16, 0.82);
      border: 1px solid rgba(143, 188, 143, 0.5);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease, border-color 0.15s ease;
    }
    .eggman-link svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .eggman-link:hover,
    .eggman-link:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.08);
      border-color: var(--accent);
    }
    .eggman-link:focus {
      outline: none;
    }
    .eggman-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .eggman-link:hover svg,
    .eggman-link:focus-visible svg {
      animation: egg-wiggle 0.45s ease;
    }
    .eggman-link:active {
      transform: translateY(0) scale(0.96);
    }
    @keyframes egg-wiggle {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-8deg); }
      70% { transform: rotate(6deg); }
    }
    @media (max-height: 640px) {
      body {
        display: block;
        padding-top: 1.35rem;
      }
      main { margin: 0 auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      .eggman-link,
      .eggman-link svg {
        animation: none;
        transition: none;
      }
    }
    .hit-counter {
      margin-top: 1.75rem;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      padding: 0.65rem 0.85rem 0.75rem;
      background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 40%, #0a0a0a 100%);
      border: 2px solid #666;
      border-top-color: #999;
      border-left-color: #888;
      border-right-color: #333;
      border-bottom-color: #222;
      box-shadow: inset 0 0 0 1px #000, 3px 3px 0 #000;
      font-family: "Courier New", Courier, monospace;
    }
    .hit-counter .label {
      color: #cfcfcf;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .hit-counter .digits {
      display: inline-flex;
      gap: 2px;
      padding: 4px 6px;
      background: #020802;
      border: 2px inset #444;
      box-shadow: inset 0 0 8px #000;
    }
    .hit-counter .digit {
      width: 1.05em;
      font-size: 1.35rem;
      line-height: 1.2;
      color: #39ff14;
      text-shadow: 0 0 6px #39ff14, 0 0 12px #1aff00;
      background: #001100;
      border: 1px solid #0a3a0a;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .hit-counter .sub {
      color: #888;
      font-size: 0.65rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Far Future Solutions LLC</p>
    <h1>Building toward what comes next.</h1>
    <p>Applied systems work from Ukiah, California.</p>
    <p>
      <a class="contact" href="mailto:paul@farfuturesolutions.com">Contact</a>
    </p>
    <div class="hit-counter" aria-label="Visit counter">
      <span class="label">You are visitor #</span>
      <span class="digits" id="hit-digits" aria-live="polite"></span>
      <span class="sub">hits since 1997</span>
    </div>
    <footer>2026 &copy; Far Future Solutions LLC</footer>
  </main>
  <a class="eggman-link" href="eggman/" aria-label="Play Egg Man" title="Play Egg Man">
    <svg viewBox="0 0 64 80" aria-hidden="true" focusable="false">
      <ellipse cx="32" cy="74" rx="16" ry="4" fill="#000" opacity="0.28"/>
      <path d="M16 48 Q6 40 10 30" fill="none" stroke="#243024" stroke-width="5" stroke-linecap="round"/>
      <path d="M16 48 Q6 40 10 30" fill="none" stroke="#f4efe4" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M48 48 Q58 40 54 30" fill="none" stroke="#243024" stroke-width="5" stroke-linecap="round"/>
      <path d="M48 48 Q58 40 54 30" fill="none" stroke="#f4efe4" stroke-width="3.2" stroke-linecap="round"/>
      <ellipse cx="24" cy="70" rx="8" ry="4.2" fill="#e6d5b4" stroke="#243024" stroke-width="1.2"/>
      <ellipse cx="42" cy="70" rx="8" ry="4.2" fill="#dcc8a0" stroke="#243024" stroke-width="1.2"/>
      <ellipse cx="32" cy="38" rx="18" ry="24" fill="#f6f1e4" stroke="#8fbc8f" stroke-width="2"/>
      <ellipse cx="25" cy="30" rx="7" ry="10" fill="#fff" opacity="0.35"/>
      <ellipse cx="25" cy="36" rx="2.7" ry="3.3" fill="#1c241c"/>
      <ellipse cx="39" cy="36" rx="2.7" ry="3.3" fill="#1c241c"/>
      <circle cx="26" cy="34.8" r="0.9" fill="#fff"/>
      <circle cx="40" cy="34.8" r="0.9" fill="#fff"/>
      <ellipse cx="20.5" cy="42" rx="3" ry="1.8" fill="#e7a8ad" opacity="0.8"/>
      <ellipse cx="43.5" cy="42" rx="3" ry="1.8" fill="#e7a8ad" opacity="0.8"/>
      <path d="M26 46.5 Q32 51 38 46.5" fill="none" stroke="#1c241c" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </a>
  <script>
    (function () {
      var el = document.getElementById("hit-digits");
      function render(n) {
        var s = String(Math.max(0, Math.floor(Number(n) || 0)));
        while (s.length < 8) s = "0" + s;
        el.textContent = "";
        for (var i = 0; i < s.length; i++) {
          var d = document.createElement("span");
          d.className = "digit";
          d.textContent = s.charAt(i);
          el.appendChild(d);
        }
      }
      render(0);
      // Free no-signup counter (abacus); increments on each page load
      fetch("https://abacus.jasoncameron.dev/hit/farfuturesolutions.com/park")
        .then(function (r) { return r.json(); })
        .then(function (data) { render(data && data.value); })
        .catch(function () { /* keep zeros if blocked */ });
    })();
  </script>
</body>
</html>
